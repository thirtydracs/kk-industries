<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K&K Industries — Weekly Snapshot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f10;
      --surface:  #161a1c;
      --surface2: #1e2426;
      --border:   #2a3035;
      --accent:   #e8a020;
      --text:     #e8ecee;
      --muted:    #7a8a92;
      --danger:   #d95040;
      --ok:       #3ab07a;
      --warn:     #e8a020;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(circle, #2a3035 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
      height: 64px; position: sticky; top: 0; z-index: 200;
    }

    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

    .logo-mark {
      width: 36px; height: 36px; background: var(--accent); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #000; flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: .08em; color: var(--text); line-height: 1;
    }

    .logo-sub {
      font-size: 11px; color: var(--muted); font-weight: 400;
      letter-spacing: .12em; text-transform: uppercase; margin-top: 2px;
    }

    .header-right { display: flex; align-items: center; gap: 16px; }

    .live-badge {
      display: flex; align-items: center; gap: 6px; font-size: 11px;
      font-weight: 500; color: var(--ok); font-family: 'DM Mono', monospace;
      letter-spacing: .06em; text-transform: uppercase;
    }

    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok); animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.8); }
    }

    .date-stamp { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

    /* ── PAGE ── */
    .page { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ── TABS ── */
    .tab-bar {
      display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 5px; margin-bottom: 32px; width: fit-content;
      animation: fadeUp .5s .05s ease both;
    }

    .tab {
      padding: 9px 22px; border-radius: 8px; font-size: 13px; font-weight: 500;
      color: var(--muted); cursor: pointer; border: none; background: transparent;
      transition: all .2s ease; letter-spacing: .03em; text-decoration: none; display: inline-block;
    }

    .tab:hover { color: var(--text); background: var(--surface2); }
    .tab.active { background: var(--accent); color: #000; font-weight: 600; }

    /* ── WEEK NAV ── */
    .week-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px; animation: fadeUp .5s ease both;
    }

    .week-nav-left h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 5vw, 56px); letter-spacing: .05em; line-height: 1;
    }

    .week-nav-left h1 span { color: var(--accent); }

    .week-nav-left p { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

    .week-controls { display: flex; align-items: center; gap: 8px; }

    .week-btn {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; font-family: 'DM Mono', monospace;
    }

    .week-btn:hover { border-color: var(--accent); color: var(--accent); }

    .week-label {
      font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted);
      padding: 8px 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; white-space: nowrap;
    }

    /* ── DAY STRIP ── */
    .day-strip {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px; margin-bottom: 32px; animation: fadeUp .5s .1s ease both;
    }

    .day-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; text-align: center;
      transition: border-color .2s; cursor: default;
    }

    .day-chip.has-activity { border-color: var(--border); }
    .day-chip.today { border-color: var(--accent); }

    .day-chip-name {
      font-size: 10px; font-weight: 600; color: var(--muted);
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px;
    }

    .day-chip-date {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .04em;
      color: var(--text); line-height: 1;
    }

    .day-chip.today .day-chip-date { color: var(--accent); }

    .day-chip-sites {
      margin-top: 6px; font-size: 10px; color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .day-dot-row { display: flex; gap: 3px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }

    .day-dot {
      width: 6px; height: 6px; border-radius: 50%;
    }

    .day-dot.ok   { background: var(--ok); }
    .day-dot.warn { background: var(--warn); }
    .day-dot.bad  { background: var(--danger); }
    .day-dot.off  { background: var(--border); }

    /* ── PROJECT CARDS ── */
    .project-grid {
      display: grid; gap: 16px; animation: fadeUp .5s .15s ease both;
    }

    .proj-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }

    .proj-card-head {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      padding: 18px 22px; border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .proj-card-title-block { display: flex; align-items: center; gap: 12px; }

    .proj-color-bar {
      width: 4px; height: 36px; border-radius: 2px; flex-shrink: 0;
    }

    .proj-color-bar.ok   { background: var(--ok); }
    .proj-color-bar.warn { background: var(--warn); }
    .proj-color-bar.bad  { background: var(--danger); }

    .proj-card-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: .06em; color: var(--text); line-height: 1;
    }

    .proj-card-meta { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 99px; font-size: 11px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
    }

    .status-pill.ok   { background: rgba(58,176,122,.12);  color: var(--ok); }
    .status-pill.warn { background: rgba(232,160,32,.12);  color: var(--warn); }
    .status-pill.bad  { background: rgba(217,80,64,.12);   color: var(--danger); }

    .pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* card body grid */
    .proj-card-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    }

    .proj-col {
      padding: 18px 22px; border-right: 1px solid var(--border);
    }

    .proj-col:last-child { border-right: none; }

    .proj-col-title {
      font-size: 10px; font-weight: 600; color: var(--muted);
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }

    .proj-item {
      display: flex; gap: 8px; align-items: flex-start;
      margin-bottom: 8px; font-size: 13px; line-height: 1.5; color: var(--text);
    }

    .proj-item:last-child { margin-bottom: 0; }

    .proj-item-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
    }

    .proj-item-dot.ok   { background: var(--ok); }
    .proj-item-dot.warn { background: var(--warn); }
    .proj-item-dot.bad  { background: var(--danger); }
    .proj-item-dot.muted { background: var(--border); }

    /* card footer */
    .proj-card-foot {
      padding: 12px 22px; border-top: 1px solid var(--border);
      background: var(--surface2); display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }

    .proj-foot-stats { display: flex; gap: 20px; }

    .proj-foot-stat { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
    .proj-foot-stat span { color: var(--text); font-weight: 500; }

    .proj-foot-btn {
      font-size: 12px; color: var(--accent); font-weight: 500; cursor: pointer;
      background: none; border: none; letter-spacing: .04em; transition: opacity .2s;
    }

    .proj-foot-btn:hover { opacity: .7; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border); padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @media (max-width: 700px) {
      header { padding: 0 16px; }
      .page  { padding: 24px 16px 60px; }
      .proj-card-body { grid-template-columns: 1fr; }
      .proj-col { border-right: none; border-bottom: 1px solid var(--border); }
      .proj-col:last-child { border-bottom: none; }
      .week-nav { flex-direction: column; align-items: flex-start; gap: 12px; }
      .tab { padding: 8px 14px; font-size: 12px; }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">
      <div class="logo-mark">KK</div>
      <div>
        <div class="logo-text">K&amp;K Industries</div>
        <div class="logo-sub">Site Snapshots</div>
      </div>
    </a>
    <div class="header-right">
      <div class="live-badge"><div class="live-dot"></div>Live</div>
      <div class="date-stamp" id="datestamp"></div>
    </div>
  </header>

  <div class="page">

    <!-- TABS -->
    <div class="tab-bar">
      <a href="index.html"   class="tab">Overview</a>
      <a href="weekly.html"  class="tab active">Weekly</a>
      <a href="monthly.html" class="tab">Monthly</a>
    </div>

    <!-- WEEK NAV -->
    <div class="week-nav">
      <div class="week-nav-left">
        <h1>Week <span id="weekNum">14</span> Snapshot</h1>
        <p id="weekRange">Mon 31 Mar – Fri 4 Apr 2026</p>
      </div>
      <div class="week-controls">
        <button class="week-btn" id="prevWeek">‹</button>
        <div class="week-label" id="weekLabel">Week 14 · 2026</div>
        <button class="week-btn" id="nextWeek">›</button>
      </div>
    </div>

    <!-- DAY STRIP -->
    <div class="day-strip" id="dayStrip"></div>

    <!-- PROJECT CARDS -->
    <div class="project-grid" id="projectGrid"></div>

  </div>

  <footer>
    <span>K&amp;K Industries Pty Ltd</span>
    <span id="footer-time"></span>
  </footer>

  <script>
    /* DATE/TIME */
    function fmt(d) {
      return d.toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    }
    function tick() {
      const now = new Date();
      document.getElementById('datestamp').textContent   = fmt(now);
      document.getElementById('footer-time').textContent = 'Last updated ' + now.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
    }
    tick(); setInterval(tick, 30000);

    /* WEEK DATA */
    const weekData = {
      14: {
        range: 'Mon 31 Mar – Fri 4 Apr 2026',
        days: [
          { name:'Mon', date:'31', sites:4, dots:['bad','ok','warn','ok'] },
          { name:'Tue', date:'1',  sites:4, dots:['bad','ok','warn','ok'] },
          { name:'Wed', date:'2',  sites:3, dots:['bad','ok','warn','off'] },
          { name:'Thu', date:'3',  sites:4, dots:['bad','ok','ok','ok'] },
          { name:'Fri', date:'4',  sites:4, dots:['bad','ok','ok','ok'], today:true },
        ],
        projects: [
          {
            id:'childers', name:'Pearl Energy Childers', meta:'Ktori Group · QLD',
            status:'bad', label:'Delayed',
            works:[
              { dot:'muted', text:'Site tidying and material staging only.' },
              { dot:'muted', text:'No concrete or structural works undertaken.' },
              { dot:'ok',    text:'Temporary fencing and hoarding maintained.' },
            ],
            issues:[
              { dot:'bad',  text:'Brucon did not mobilise — 5th consecutive week of non-attendance.' },
              { dot:'bad',  text:'No revised programme received from contractor.' },
              { dot:'warn', text:'Formal delay notice drafted and ready to issue.' },
            ],
            nextWeek:'Brucon mobilisation confirmed verbally for Mon 7 Apr — site team to verify. Formal delay notice to be issued if no boots on ground by COB Monday.',
            stats:{ days:'5 / 5', labour:'4 workers', weather:'Fine' },
          },
          {
            id:'williamstown', name:'Exus Williamstown', meta:'Contractor TBC · VIC',
            status:'ok', label:'On Track',
            works:[
              { dot:'ok', text:'Internal framing completed Levels 1–3.' },
              { dot:'ok', text:'Rough-in plumbing and electrical progressing Level 2.' },
              { dot:'ok', text:'Waterproofing completed to all wet areas Level 1.' },
            ],
            issues:[
              { dot:'warn', text:'RFI-07 (structural beam query) unanswered — 8 days outstanding.' },
              { dot:'warn', text:'RFI-09 and RFI-11 issued this week — responses due Week 15.' },
              { dot:'ok',   text:'No programme impact at this stage.' },
            ],
            nextWeek:'Commence ceiling grid Level 1. Tiling trade to begin wet areas. Chase RFI-07 response — escalate to engineer if not received by Mon.',
            stats:{ days:'5 / 5', labour:'18 workers', weather:'Fine / Showers Fri' },
          },
          {
            id:'emerald', name:'Emerald', meta:'Contractor TBC · VIC',
            status:'warn', label:'At Risk',
            works:[
              { dot:'ok',   text:'Footings poured Lots 4 and 5 — curing in progress.' },
              { dot:'ok',   text:'Slab formwork set up Lots 1–3.' },
              { dot:'muted', text:'Subcontractor for electrical not yet appointed.' },
            ],
            issues:[
              { dot:'warn', text:'Electrical and hydraulics subcontractor packages still unsigned.' },
              { dot:'warn', text:'Programme showing 5 working days float remaining — reducing.' },
              { dot:'ok',   text:'No weather delays this week.' },
            ],
            nextWeek:'Slab pour Lots 1–3 scheduled Wed 8 Apr. Contractor to provide signed subcontractor confirmation for electrical and hydraulics by COB Mon.',
            stats:{ days:'5 / 5', labour:'9 workers', weather:'Partly Cloudy' },
          },
          {
            id:'daguilar', name:"Caltex D'Aguilar", meta:'Contractor TBC · QLD',
            status:'ok', label:'On Track',
            works:[
              { dot:'ok', text:'Internal painting complete — all areas.' },
              { dot:'ok', text:'External line marking and bollard installation done.' },
              { dot:'ok', text:'Defect rectification commenced — 3 of 6 items closed.' },
            ],
            issues:[
              { dot:'warn', text:'3 defect items remain open — contractor to close by Week 15.' },
              { dot:'ok',   text:'PC inspection scheduled Tue 7 Apr.' },
              { dot:'ok',   text:'Client walkthrough confirmed for Thu 9 Apr.' },
            ],
            nextWeek:'PC inspection Tue 7 Apr. Close remaining defect items. Prepare handover documentation. Issue keys and O&M manuals to client post-inspection.',
            stats:{ days:'5 / 5', labour:'11 workers', weather:'Fine' },
          },
        ],
      },
      13: {
        range: 'Mon 24 Mar – Fri 28 Mar 2026',
        days: [
          { name:'Mon', date:'24', sites:4, dots:['bad','ok','warn','ok'] },
          { name:'Tue', date:'25', sites:4, dots:['bad','ok','warn','ok'] },
          { name:'Wed', date:'26', sites:4, dots:['bad','ok','warn','ok'] },
          { name:'Thu', date:'27', sites:4, dots:['bad','ok','warn','ok'] },
          { name:'Fri', date:'28', sites:3, dots:['bad','ok','off','ok'] },
        ],
        projects: [
          {
            id:'childers', name:'Pearl Energy Childers', meta:'Ktori Group · QLD',
            status:'bad', label:'Delayed',
            works:[
              { dot:'muted', text:'Yard cleanup and waste removal only.' },
              { dot:'muted', text:'No productive works recorded.' },
            ],
            issues:[
              { dot:'bad', text:'Brucon again absent — fourth consecutive week of non-mobilisation.' },
              { dot:'bad', text:'Contractor yet to provide updated programme.' },
            ],
            nextWeek:'Final notice to contractor re Brucon mobilisation. Formal delay notice preparation.',
            stats:{ days:'5 / 5', labour:'3 workers', weather:'Fine' },
          },
          {
            id:'williamstown', name:'Exus Williamstown', meta:'Contractor TBC · VIC',
            status:'ok', label:'On Track',
            works:[
              { dot:'ok', text:'Internal framing Level 2 commenced.' },
              { dot:'ok', text:'Rough-in plumbing Level 1 complete.' },
            ],
            issues:[
              { dot:'warn', text:'RFI-07 issued — pending structural response.' },
            ],
            nextWeek:'Continue framing Level 2–3. Waterproofing wet areas Level 1.',
            stats:{ days:'5 / 5', labour:'16 workers', weather:'Fine' },
          },
          {
            id:'emerald', name:'Emerald', meta:'Contractor TBC · VIC',
            status:'warn', label:'At Risk',
            works:[
              { dot:'ok',   text:'Footings Lots 1–3 poured and cured.' },
              { dot:'muted', text:'Trade procurement still in progress.' },
            ],
            issues:[
              { dot:'warn', text:'Subcontractor appointments overdue for electrical and hydraulics.' },
            ],
            nextWeek:'Set up formwork Lots 4–5. Finalise subcontractor appointments.',
            stats:{ days:'4 / 5', labour:'8 workers', weather:'Showers Wed' },
          },
          {
            id:'daguilar', name:"Caltex D'Aguilar", meta:'Contractor TBC · QLD',
            status:'ok', label:'On Track',
            works:[
              { dot:'ok', text:'External painting complete.' },
              { dot:'ok', text:'Landscaping 90% complete.' },
            ],
            issues:[
              { dot:'ok', text:'No issues this week.' },
            ],
            nextWeek:'Internal painting. Line marking. Defect identification walkthrough.',
            stats:{ days:'5 / 5', labour:'12 workers', weather:'Fine' },
          },
        ],
      },
    };

    /* RENDER */
    let currentWeek = 14;

    function renderWeek(wk) {
      const data = weekData[wk] || weekData[14];

      document.getElementById('weekNum').textContent   = wk;
      document.getElementById('weekRange').textContent = data.range;
      document.getElementById('weekLabel').textContent = `Week ${wk} · 2026`;

      // Day strip
      const strip = document.getElementById('dayStrip');
      strip.innerHTML = data.days.map(d => `
        <div class="day-chip ${d.today ? 'today' : 'has-activity'}">
          <div class="day-chip-name">${d.name}</div>
          <div class="day-chip-date">${d.date}</div>
          <div class="day-chip-sites">${d.sites} sites</div>
          <div class="day-dot-row">
            ${d.dots.map(c => `<div class="day-dot ${c}"></div>`).join('')}
          </div>
        </div>
      `).join('');

      // Project cards
      const grid = document.getElementById('projectGrid');
      grid.innerHTML = data.projects.map(p => `
        <div class="proj-card">
          <div class="proj-card-head">
            <div class="proj-card-title-block">
              <div class="proj-color-bar ${p.status}"></div>
              <div>
                <div class="proj-card-name">${p.name}</div>
                <div class="proj-card-meta">${p.meta}</div>
              </div>
            </div>
            <div class="status-pill ${p.status}">
              <div class="pill-dot"></div>${p.label}
            </div>
          </div>
          <div class="proj-card-body">
            <div class="proj-col">
              <div class="proj-col-title">Works Completed</div>
              ${p.works.map(w => `
                <div class="proj-item">
                  <div class="proj-item-dot ${w.dot}"></div>
                  <span>${w.text}</span>
                </div>
              `).join('')}
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K&K Industries — Weekly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d0f10;

      --surf2:  #1e2426;
      --border: #2a3035;
      --accent: #e8a020;
      --text:   #e8ecee;
      --muted:  #7a8a92;
      --ok:     #3ab07a;
      --warn:   #e8a020;
      --bad:    #d95040;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg) radial-gradient(circle, #2a3035 1px, transparent 1px);

      color: var(--text); min-height: 100vh;
    }

    header {
      position: sticky; top: 0; z-index: 100; height: 64px; padding: 0 32px;
      background: var(--surf); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

    .logo-mark {

      color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 18px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .logo-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: .08em; color: var(--text); line-height: 1;
    }

    .logo-sub {
      font-size: 11px; color: var(--muted); letter-spacing: .12em;
      text-transform: uppercase; margin-top: 2px;
    }

    .hdr-right { display: flex; align-items: center; gap: 16px; }

    .live {
      display: flex; align-items: center; gap: 6px; font-size: 11px;
      font-weight: 500; color: var(--ok); font-family: 'DM Mono', monospace;
      letter-spacing: .06em; text-transform: uppercase;
    }

    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.8); }
    }

    .hdr-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

    /* ── PAGE ── */
    .page { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ── TABS ── */
    .tabs {
      display: flex; gap: 4px; width: fit-content;
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 12px; padding: 5px; margin-bottom: 32px;
    }

    .tab {
      padding: 9px 22px; border-radius: 8px; font-size: 13px; font-weight: 500;
      color: var(--muted); border: none; background: transparent;
      text-decoration: none; display: inline-block; transition: all .18s;
    }

    .tab:hover { color: var(--text); background: var(--surf2); }
    .tab.active { background: var(--accent); color: #000; font-weight: 600; }

    /* ── WEEK NAV ── */
    .week-nav {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 14px; margin-bottom: 28px;
    }

    .week-nav h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 5vw, 56px); letter-spacing: .05em; line-height: 1;
    }

    .week-nav h1 em { color: var(--accent); font-style: normal; }

    .week-range { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 5px; }

    .week-controls { display: flex; align-items: center; gap: 8px; }

    .nav-btn {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--surf); border: 1px solid var(--border);
      color: var(--muted); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .18s;
    }

    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }

    .nav-label {
      font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted);
      padding: 8px 14px; background: var(--surf); border: 1px solid var(--border);
      border-radius: 8px; white-space: nowrap;
    }

    /* ── DAY STRIP ── */
    .day-strip {
      display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-bottom: 28px;
    }

    .day-chip {
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 10px; text-align: center;
    }

    .day-chip.today { border-color: var(--accent); }

    .day-name {
      font-size: 10px; font-weight: 600; color: var(--muted);
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px;
    }

    .day-date {
      font-family: 'Bebas Neue', sans-serif; font-size: 24px;
      letter-spacing: .04em; line-height: 1;
    }

    .day-chip.today .day-date { color: var(--accent); }

    .day-dots { display: flex; gap: 3px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }

    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.ok   { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad  { background: var(--bad); }
    .dot.off  { background: var(--border); }

    /* ── STATUS PILL ── */
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 99px; font-size: 11px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
    }

    .pill.ok   { background: rgba(58,176,122,.12);  color: var(--ok); }
    .pill.warn { background: rgba(232,160,32,.12);  color: var(--warn); }
    .pill.bad  { background: rgba(217,80,64,.12);   color: var(--bad); }
    .pill-dot  { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* ── JOB CARD ── */
    .job-card {
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; margin-bottom: 16px;
    }

    .job-card:last-child { margin-bottom: 0; }

    /* card header */
    .job-head {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surf2);
    }

    .job-head-left { display: flex; align-items: center; gap: 12px; }

    .status-bar { width: 4px; height: 36px; border-radius: 2px; flex-shrink: 0; }
    .status-bar.ok   { background: var(--ok); }
    .status-bar.warn { background: var(--warn); }
    .status-bar.bad  { background: var(--bad); }

    .job-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      letter-spacing: .06em; line-height: 1;
    }

    .job-location { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* card body — 2 columns */
    .job-body { display: grid; grid-template-columns: 1fr 1fr; }

    .job-col { padding: 16px 20px; border-right: 1px solid var(--border); }
    .job-col:last-child { border-right: none; }

    .col-title {
      font-size: 10px; font-weight: 600; color: var(--muted);
      letter-spacing: .1em; text-transform: uppercase;
      padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
    }

    /* bullet list items */
    .job-item {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 13px; line-height: 1.5; margin-bottom: 7px;
    }

    .job-item:last-child { margin-bottom: 0; }

    .item-dot {
      width: 6px; height: 6px; border-radius: 50%;
      flex-shrink: 0; margin-top: 5px;
    }

    .item-dot.ok    { background: var(--ok); }
    .item-dot.warn  { background: var(--warn); }
    .item-dot.bad   { background: var(--bad); }
    .item-dot.muted { background: var(--border); }

    /* blocker box — amber tinted */
    .blocker-box {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 13px; border-radius: 8px; margin-top: 12px;
      background: rgba(232,160,32,.07); border: 1px solid rgba(232,160,32,.22);
      font-size: 13px; line-height: 1.5;
    }

    .blocker-box.none { display: none; }

    .blocker-icon {
      font-size: 13px; flex-shrink: 0; margin-top: 1px; color: var(--warn);
    }

    .blocker-label {
      font-size: 10px; font-weight: 600; color: var(--warn);
      letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px;
    }

    .blocker-text { color: var(--text); }

    /* card footer */
    .job-foot {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
      padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surf2);
    }

    .foot-subs {
      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted);
    }

    .foot-subs strong { color: var(--text); font-weight: 500; }

    .foot-link {
      font-size: 12px; font-weight: 500; color: var(--accent);
      background: none; border: none; cursor: pointer; letter-spacing: .04em;
      transition: opacity .18s;
    }

    .foot-link:hover { opacity: .65; }

    /* ── NEXT DAY PANEL ── */
    .next-card {
      background: var(--surf); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; margin-top: 24px;
    }

    .next-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surf2);
    }

    .next-head-label {
      font-size: 13px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
    }

    .next-head-wk { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

    .next-row {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
    }

    .next-row:last-child { border-bottom: none; }

    .next-bar { width: 4px; border-radius: 2px; flex-shrink: 0; align-self: stretch; }
    .next-bar.ok   { background: var(--ok); }
    .next-bar.warn { background: var(--warn); }
    .next-bar.bad  { background: var(--bad); }

    .next-proj {
      font-size: 11px; font-weight: 600; color: var(--muted);
      letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px;
    }

    .next-text { font-size: 13px; line-height: 1.55; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border); padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .a1 { animation: fadeUp .45s ease both; }
    .a2 { animation: fadeUp .45s .08s ease both; }
    .a3 { animation: fadeUp .45s .16s ease both; }
    .a4 { animation: fadeUp .45s .24s ease both; }

    @media (max-width: 680px) {
      header, footer { padding-left: 16px; padding-right: 16px; }
      .page { padding: 24px 16px 60px; }
      .job-body { grid-template-columns: 1fr; }
      .job-col { border-right: none; border-bottom: 1px solid var(--border); }
      .job-col:last-child { border-bottom: none; }
      .week-nav { flex-direction: column; align-items: flex-start; }
      .tab { padding: 8px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">
      <div class="logo-mark">KK</div>
      <div>
        <div class="logo-name">K&amp;K Industries</div>
        <div class="logo-sub">Site Snapshots</div>
      </div>
    </a>
    <div class="hdr-right">
      <div class="live"><div class="live-dot"></div>Live</div>
      <div class="hdr-date" id="hdrDate"></div>
    </div>
  </header>

  <div class="page">

    <nav class="tabs a1">
      <a class="tab" href="index.html">Overview</a>
      <a class="tab active" href="weekly.html">Weekly</a>
      <a class="tab" href="monthly.html">Monthly</a>
    </nav>

    <div class="week-nav a2">
      <div>
        <h1>Week <em id="wkNum">14</em> Snapshot</h1>
        <div class="week-range" id="wkRange"></div>
      </div>
      <div class="week-controls">
        <button class="nav-btn" id="btnPrev">‹</button>
        <div class="nav-label" id="wkLabel"></div>
        <button class="nav-btn" id="btnNext">›</button>
      </div>
    </div>

    <div class="day-strip a3" id="dayStrip"></div>
    <div id="jobGrid" class="a4"></div>
    <div id="nextPanel"></div>

  </div>

  <footer>
    <span>K&amp;K Industries Pty Ltd</span>
    <span id="ftrTime"></span>
  </footer>

  <script src="data/weekly.js"></script>
  <script>
    /* ── CLOCK ── */
    const fmtDate = d => d.toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    const tick = () => {
      const n = new Date();
      document.getElementById('hdrDate').textContent = fmtDate(n);
      document.getElementById('ftrTime').textContent = 'Last updated ' + n.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
    };
    tick(); setInterval(tick, 30000);

    /* ── STATUS HELPERS ── */
    // Maps programmeStatus string → CSS class
    function statusClass(s) {
      if (s === 'Behind')   return 'bad';
      if (s === 'At Risk')  return 'warn';
      if (s === 'Ahead')    return 'ok';
      return 'ok'; // "On Track" default
    }

    /* ── RENDER ── */
    let cur = 14;
    const keys = Object.keys(WEEKS).map(Number).sort((a,b) => a - b);

    function render(wk) {
      const d = WEEKS[wk];

      document.getElementById('wkNum').textContent   = wk;
      document.getElementById('wkRange').textContent = d.range;
      document.getElementById('wkLabel').textContent = `Week ${wk} · 2026`;
      document.getElementById('btnPrev').disabled    = (wk === Math.min(...keys));
      document.getElementById('btnNext').disabled    = (wk === Math.max(...keys));

      /* Day strip */
      document.getElementById('dayStrip').innerHTML = d.days.map(day => `
        <div class="day-chip${day.today ? ' today' : ''}">
          <div class="day-name">${day.name}</div>
          <div class="day-date">${day.date}</div>
          <div class="day-dots">${day.dots.map(c => `<div class="dot ${c}"></div>`).join('')}</div>
        </div>
      `).join('');

      /* Job cards */
      document.getElementById('jobGrid').innerHTML = d.jobs.map(j => {
        const cls        = statusClass(j.programmeStatus);
        const hasBlocker = j.holdingUp && j.holdingUp !== 'None';
        const hasSub     = j.subcontractorIssues && j.subcontractorIssues !== 'None';
        const hasMat     = j.materialIssues && j.materialIssues !== 'None';

        return `
        <div class="job-card">

          <div class="job-head">
            <div class="job-head-left">
              <div class="status-bar ${cls}"></div>
              <div>
                <div class="job-name">${j.name}</div>
                <div class="job-location">${j.location}</div>
              </div>
            </div>
            <div class="pill ${cls}"><div class="pill-dot"></div>${j.programmeStatus}</div>
          </div>

          <div class="job-body">

            <!-- LEFT: work areas + activity -->
            <div class="job-col">
              <div class="col-title">Work Areas</div>
              ${j.workAreas.map(w => `
                <div class="job-item">
                  <div class="item-dot muted"></div><span>${w}</span>
                </div>`).join('')}

              <div class="col-title" style="margin-top:16px">Today's Activity</div>
              ${j.activity.map(a => `
                <div class="job-item">
                  <div class="item-dot ok"></div><span>${a}</span>
                </div>`).join('')}
            </div>

            <!-- RIGHT: issues -->
            <div class="job-col">
              <div class="col-title">Issues</div>

              ${hasSub ? `
                <div class="job-item">
                  <div class="item-dot bad"></div>
                  <span><strong>Subcontractor —</strong> ${j.subcontractorIssues}</span>
                </div>` : `
                <div class="job-item">
                  <div class="item-dot ok"></div>
                  <span style="color:var(--muted)">No subcontractor issues</span>
                </div>`}

              ${hasMat ? `
                <div class="job-item">
                  <div class="item-dot warn"></div>
                  <span><strong>Materials —</strong> ${j.materialIssues}</span>
                </div>` : `
                <div class="job-item">
                  <div class="item-dot ok"></div>
                  <span style="color:var(--muted)">No material issues</span>
                </div>`}

              ${hasBlocker ? `
                <div class="blocker-box">
                  <div class="blocker-icon">⚠</div>
                  <div>
                    <div class="blocker-label">Holding Up — ${j.holdingUp}</div>
                    <div class="blocker-text">${j.holdingUpDetail}</div>
                  </div>
                </div>` : ''}
            </div>

          </div>

          <div class="job-foot">
            <div class="foot-subs">On site: <strong>${j.subcontractors}</strong></div>
            <button class="foot-link">Week ${wk} Report ↗</button>
          </div>

        </div>`;
      }).join('');

      /* Next day panel */
      document.getElementById('nextPanel').innerHTML = `
        <div class="next-card">
          <div class="next-head">
            <span class="next-head-label">Next Day — Planned Works</span>
            <span class="next-head-wk">Week ${wk}</span>
          </div>
          ${d.jobs.map(j => {
            const cls = statusClass(j.programmeStatus);
            return `
            <div class="next-row">
              <div class="next-bar ${cls}"></div>
              <div>
                <div class="next-proj">${j.name}</div>
                <div class="next-text">${j.nextDay}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      `;
    }

    render(cur);

    document.getElementById('btnPrev').addEventListener('click', () => { if (WEEKS[cur-1]) { cur--; render(cur); } });
    document.getElementById('btnNext').addEventListener('click', () => { if (WEEKS[cur+1]) { cur++; render(cur); } });
  </script>

</body>
</html>
